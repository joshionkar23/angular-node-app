<div class="admin-categories">
  <div class="toolbar">
    <h2>Categories</h2>
    <button mat-flat-button color="primary" (click)="openAddDialog()">Add Category</button>
  </div>

  @if (loading()) {
    <div class="skeleton">Loading...</div>
  }

  @if (categories()?.length) {
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Slug</th>
          <th>Description</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (c of categories(); track c.id) {
          <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.slug }}</td>
            <td>{{ c.description }}</td>
            <td>
              <button class="link-btn" (click)="openEditDialog(c.id)">Edit</button>
              &nbsp;|&nbsp;
              <button class="link-btn" (click)="openDeleteDialog(c.id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

  @if (categories()?.length === 0) {
    <div>No categories found</div>
  }
</div>
