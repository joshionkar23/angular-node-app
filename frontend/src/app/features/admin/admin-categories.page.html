<div class="admin-categories">
  <div class="toolbar">
    <h2>Categories</h2>
    <button class="btn" (click)="openModal()">Add Category</button>
  </div>

  <div *ngIf="loading()" class="skeleton">Loading...</div>

  <table *ngIf="categories()?.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Slug</th>
        <th>Description</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of categories()">
        <td>{{ c.name }}</td>
        <td>{{ c.slug }}</td>
        <td>{{ c.description }}</td>
        <td>
          <button class="link-btn" (click)="openEditModal(c.id)">Edit</button>
          &nbsp;|&nbsp;
          <button class="link-btn" (click)="openDeleteModal(c.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="categories()?.length === 0">No categories found</div>

  <div class="modal-backdrop" *ngIf="modalVisible()">
    <div class="modal">
      <h3 *ngIf="!editingId()">Add Category</h3>
      <h3 *ngIf="editingId()">Edit Category</h3>
      <div class="form-row">
        <label>Name</label>
        <input [(ngModel)]="name" placeholder="Category name" />
      </div>
      <div class="form-row">
        <label>Slug</label>
        <input [(ngModel)]="slug" placeholder="category-slug" />
      </div>
      <div class="form-row">
        <label>Description</label>
        <textarea [(ngModel)]="description" rows="3" placeholder="Description"></textarea>
      </div>
      <div class="form-row">
        <label>Image URL</label>
        <input [(ngModel)]="imageUrl" placeholder="https://..." />
      </div>
      <div class="modal-actions">
        <button class="btn" (click)="createCategory()">Save</button>
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" *ngIf="deleteModalVisible()">
    <div class="modal small">
      <div class="modal-header">
        <h3>Delete Category</h3>
        <span class="close-icon" (click)="closeDeleteModal()">✕</span>
      </div>
      <p>Are you sure you want to delete this category? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn btn-danger" (click)="confirmDelete()">Delete</button>
        <button class="btn btn-secondary" (click)="closeDeleteModal()">Cancel</button>
      </div>
    </div>
  </div>
</div>
