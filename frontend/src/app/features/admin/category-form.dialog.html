<h2 mat-dialog-title>{{ data.category ? 'Edit Category' : 'Add Category' }}</h2>
<mat-dialog-content>
  <div class="form-row">
    <label for="category-name">Name</label>
    <input id="category-name" [formField]="categoryForm.name" placeholder="Category name" />
    @if (categoryForm.name().touched() && categoryForm.name().errors().length) {
      <small class="error">Name is required</small>
    }
  </div>
  <div class="form-row">
    <label for="category-slug">Slug</label>
    <input id="category-slug" [formField]="categoryForm.slug" placeholder="category-slug" />
    @if (categoryForm.slug().touched() && categoryForm.slug().errors().length) {
      <small class="error">Slug is required</small>
    }
  </div>
  <div class="form-row">
    <label for="category-description">Description</label>
    <textarea id="category-description" [formField]="categoryForm.description" rows="3" placeholder="Description"></textarea>
  </div>
  <div class="form-row">
    <label for="category-image-url">Image URL</label>
    <input id="category-image-url" [formField]="categoryForm.imageUrl" placeholder="https://..." />
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="!categoryForm().valid()" (click)="save()">
    Save
  </button>
</mat-dialog-actions>
